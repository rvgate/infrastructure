[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:chrome]
command=bash -c 'until [ -e /tmp/.X11-unix/X99 ]; do sleep 1; done; rm -f ~/.config/google-chrome/Singleton*; exec google-chrome --no-first-run --no-default-browser-check --disable-dev-shm-usage --log-level=3 --window-position=0,0 --window-size=1920,1080'
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vnc]
command=bash -c 'until [ -e /tmp/.X11-unix/X99 ]; do sleep 1; done; exec x11vnc -display :99 -forever -shared -quiet -rfbport 5900 -rfbauth ~/.vnc/passwd'
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:remote-control]
command=/usr/local/bin/remote-control.sh
priority=40
autorestart=true
startsecs=0
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
