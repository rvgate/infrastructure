---
- name: include Ubuntu docker based installation
  include_tasks: docker-install-ubuntu.yml
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: include Raspbian docker based installation
  include_tasks: docker-install-raspbian.yml
  when: inventory_hostname in groups.raspberry

- name: include Fedora docker based installation
  include_tasks: docker-install-fedora.yml
  when: ansible_facts['distribution'] == 'Fedora'

- name: generate portainer password
  ansible.builtin.shell:
    cmd: >
      htpasswd -nbB admin '{{ portainer_password }}'
      | cut -d ':' -f 2
      | xargs echo -n
      > ~/.portainer_password
    creates: ~/.portainer_password

- name: save generated password
  ansible.builtin.shell:
      cmd: cat ~/.portainer_password
  register: generated_portainer_password
  changed_when: False
  check_mode: false

# Portainer used to store its data in an anonymous volume, which is lost when
# the container is recreated. Copy it once into the named volume.
- name: migrate portainer data to named volume
  ansible.builtin.shell:
    cmd: |
      docker volume inspect portainer_data > /dev/null 2>&1 && exit 0
      docker volume create portainer_data > /dev/null
      if docker inspect portainer > /dev/null 2>&1; then
        docker stop portainer > /dev/null
        docker run --rm --volumes-from portainer -v portainer_data:/target alpine cp -a /data/. /target/
      fi
      echo migrated
  register: portainer_migration
  changed_when: "'migrated' in portainer_migration.stdout"

- name: run portainer container
  docker_container:
    name: portainer
    image: portainer/portainer-ce:latest
    pull: yes
    state: started
    restart_policy: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    env:
      VIRTUAL_HOST: "portainer.{{ domain }}"
      VIRTUAL_PORT: "9000"
      NETWORK_ACCESS: "internal"
    command: "--admin-password '{{ generated_portainer_password.stdout }}'"
    labels:
      logging: enabled

- name: run watchtower container
  docker_container:
    name: watchtower
    image: nickfedor/watchtower:latest # containrrr/watchtower is unmaintained and incompatible with Docker 29+
    pull: yes
    state: started
    restart_policy: always
    env:
      WATCHTOWER_SCHEDULE: "0 0 1 * * *" # 01:00 UTC every day, before the 02:00 UTC crawler jobs (Spring syntax)
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_LIFECYCLE_HOOKS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
