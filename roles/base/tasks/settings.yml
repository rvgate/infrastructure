---
- name: set open file limit (fedora)
  sysctl:
    name: fs.file-max
    value: "9223372036854775807"
    state: present
  when: ansible_facts['distribution'] == 'Fedora'

- name: set open file limit (raspberry)
  pam_limits:
    domain: "*"
    limit_type: "-"
    limit_item: nofile
    value: 65536
  when: inventory_hostname in groups.raspberry